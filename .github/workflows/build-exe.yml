# Compila LAY.exe + instalador en un runner Windows en cada push a main y en cada tag v*.
# Descarga: pestaña Actions -> último run -> Artifacts "LAY-windows".  Con tag v2.0.1 crea un Release.
name: build-exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # para publicar el Release con el instalador

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Versión
        id: ver
        shell: pwsh
        run: |
          $base = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "$base" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Build
        shell: pwsh
        run: ./build_exe.ps1 -Version ${{ steps.ver.outputs.version }}
      - name: Diagnóstico del exe en Windows real (manos, navegador, apps, web, voz)
        shell: pwsh
        env:
          LAY_DATA: ${{ runner.temp }}\lay-diag
        run: |
          New-Item -ItemType Directory -Force $env:LAY_DATA | Out-Null
          & .\dist\LAY\LAY-cli.exe --rol diagnostico --ci
          $code = $LASTEXITCODE
          Get-Content "$env:LAY_DATA\diagnostico.txt"
          if (Test-Path "$env:LAY_DATA\errores.log") { Get-Content "$env:LAY_DATA\errores.log" -Tail 80 }
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: LAY-windows
          path: |
            dist/LAY_Setup_*.exe
            dist/LAY_portable_*.zip
      - name: Release
        # Cada push a main publica (o actualiza) el Release vX.Y.Z con el instalador: Robert siempre recibe el .exe
        if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LAY ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Instalador de LAY ${{ steps.ver.outputs.version }} para Windows 10/11.
            1. Descarga LAY_Setup_${{ steps.ver.outputs.version }}.exe y ejecútalo (no pide admin).
            2. La primera vez se abre el asistente: pega tu clave de Anthropic.
            3. Di "LAY". Portable: LAY_portable_${{ steps.ver.outputs.version }}.zip
          files: |
            dist/LAY_Setup_*.exe
            dist/LAY_portable_*.zip
